# Publishes the site to GitHub Pages: builds the web version of CaretFlow from its repository,
# then uploads this folder. Turn it on once under Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Sooeeren/CaretFlow
          path: .caretflow-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: .caretflow-src
      - run: node scripts/build-demo.mjs --src .caretflow-src
      - run: rm -rf .caretflow-src .git .github
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
